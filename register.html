<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your HabitIQ account to start tracking and optimizing your daily habits with AI-powered insights.">
  <title>Register — HabitIQ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>

  <!-- Minimal Nav -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="register.html" class="nav-brand">
        <div class="nav-brand-icon">🧠</div>
        <span>HabitIQ</span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Register Card -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🧠</div>
        <h1>Create Account</h1>
        <p>Start your habit intelligence journey</p>
      </div>

      <div id="registerMsg" class="message"></div>

      <form id="registerForm" autocomplete="off">
        <div class="form-group">
          <label for="regUsername">Username</label>
          <input 
            type="text" 
            id="regUsername" 
            class="form-input" 
            placeholder="Choose a username"
            required
            minlength="3"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="regPassword" 
              class="form-input" 
              placeholder="Create a password"
              required
              minlength="4"
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="regConfirmPassword" 
              class="form-input" 
              placeholder="Confirm your password"
              required
              minlength="4"
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="registerBtn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="sampleData.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
